openapi: 3.0.3
info:
  title: Cost Centers API
  version: '1.8'
  description: Use this API to manage cost objects (cost centers) in your Perk organization.
servers:
- url: https://api.perk.com
paths:
  /cost_centers:
    get:
      summary: List all cost centers
      description: Lists all cost centers in your organization. Returns a paginated list with offset and limit controls. When cost object types are enabled for your organization, each item includes an optional `type` field (string name or null).
      operationId: list-cost-centers
      tags:
      - Cost centers
      parameters:
      - name: Authorization
        in: header
        description: Your Perk API key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns '200 OK' and a paginated list of cost centers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                    description: The number of items skipped before the current page
                    example: 0
                  limit:
                    type: integer
                    description: The maximum number of items returned per page
                    example: 10
                  cost_centers:
                    type: array
                    description: The list of cost centers
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique ID of the cost center
                          example: '2'
                        name:
                          type: string
                          description: The name of the cost center
                          example: Marketing
                        type:
                          type: string
                          nullable: true
                          description: Cost object type name, or null if unset. Available only when cost object types are enabled for your organization on request. Omitted from the response when the feature is not enabled.
                          example: Department
                        count_users:
                          type: integer
                          description: The number of users assigned to this cost center
                          example: 0
              example:
                offset: 0
                limit: 10
                cost_centers:
                - id: '2'
                  name: Marketing
                  type: Department
                  count_users: 0
    post:
      summary: Create cost center
      description: Creates a cost center with the specified name. You can optionally set an approver, delegate, delegate expiry date, additional approvers (owner_ids), and cost object type (`type`) when that feature is enabled for your organization.
      operationId: create-cost-center
      tags:
      - Cost centers
      parameters:
      - name: Authorization
        in: header
        description: Your Perk API key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: The name of the cost center
                  example: Marketing
                type:
                  type: string
                  nullable: true
                  maxLength: 256
                  description: Available only when cost object types are enabled for your organization on request, is ignored when the feature is not enabled. Cost object type name to assign on create. Non-empty string (max 256 characters). Omit or null leaves the type unset. If a type with that name already exists (case-insensitive), it is assigned; otherwise it is created. Cannot be set on Yokoy-sourced cost centers.
                  example: Department
                approver_id:
                  type: integer
                  description: The ID of the user to set as approver. The user must belong to one of the account's companies
                  example: 123
                delegate_id:
                  type: integer
                  description: The ID of the user to set as delegate. The delegate must belong to one of the account's companies
                  example: 456
                delegate_expiry:
                  type: string
                  description: The expiry date for the delegate in YYYY-MM-DD format
                  example: '2025-12-31'
                erp_code:
                  type: string
                  description: Identifier used to associate this cost center with a corresponding record in an external ERP system
                  example: CC-4210
                company_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs of companies this cost center is scoped to. Must be provided together with 'all_companies'. When 'all_companies' is true, company scope is set to all companies in the account.
                  example:
                  - 11454
                  - 22187
                all_companies:
                  type: boolean
                  description: Whether the cost center applies to all companies in the account. Must be provided together with 'company_ids'. When true, 'company_ids' is ignored and the cost center is scoped to all companies in the account. Defaults to true when neither field is provided.
                  example: false
                owner_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs of additional travel approvers to set on create. Users must belong to an allowed company for the cost center and must not duplicate approver_id
                  example:
                  - 789
                  - 790
            example:
              name: Marketing
              type: Department
              approver_id: 123
              delegate_id: 456
              delegate_expiry: '2025-12-31'
              owner_ids:
              - 789
              - 790
      responses:
        '200':
          description: Returns '200 OK' and the newly created cost center resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique ID of the cost center
                    example: '4'
                  name:
                    type: string
                    description: The name of the cost center
                    example: Marketing
                  type:
                    type: string
                    nullable: true
                    description: Cost object type name, or null if unset. Available only when cost object types are enabled for your organization on request. Omitted from the response when the feature is not enabled.
                    example: Department
                  archived:
                    type: boolean
                    description: Indicates whether the cost center is archived
                    example: false
                  approver_id:
                    type: integer
                    example: 123
                    description: The ID of the approver user, or 'null' if not set
                  approver:
                    type: object
                    description: Approver user details, or 'null' if not set
                    properties:
                      id:
                        type: integer
                        description: The unique ID of the approver
                        example: 123
                      first_name:
                        type: string
                        description: The approver's first name
                        example: Alex
                      last_name:
                        type: string
                        description: The approver's last name
                        example: Chen
                      email:
                        type: string
                        description: The approver's email address
                        example: alex.chen@company.com
                  delegate_id:
                    type: integer
                    example: 456
                    description: The ID of the delegate user, or 'null' if not set
                  delegate:
                    type: object
                    description: Delegate user details, or 'null' if not set
                    properties:
                      id:
                        type: integer
                        description: The unique ID of the delegate
                        example: 456
                      first_name:
                        type: string
                        description: The delegate's first name
                        example: Jordan
                      last_name:
                        type: string
                        description: The delegate's last name
                        example: Smith
                      email:
                        type: string
                        description: The delegate's email address
                        example: jordan.smith@company.com
                  delegate_expiry:
                    type: string
                    example: '2025-12-31'
                    description: The expiry date for the delegate in YYYY-MM-DD format, or 'null' if not set
                  users:
                    type: array
                    description: The users assigned to this cost center
                    items:
                      type: object
                  count_users:
                    type: integer
                    description: The number of users assigned to this cost center
                    example: 0
                  erp_code:
                    type: string
                    description: Identifier used to associate this cost center with a corresponding record in an external ERP system
                    example: CC-4210
                  all_companies:
                    type: boolean
                    description: If 'true', the cost center applies to all companies in the account
                    example: false
                  companies:
                    type: array
                    description: The IDs of companies assigned to this cost center
                    items:
                      type: integer
                    example:
                    - 1
                    - 2
                  owner_ids:
                    type: array
                    items:
                      type: integer
                    description: IDs of additional travel approvers
                    example:
                    - 789
                    - 790
                  owners:
                    type: array
                    description: Additional travel approver user details (id, first_name, last_name, email)
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The unique ID of the additional approver
                          example: 789
                        first_name:
                          type: string
                          description: The additional approver's first name
                          example: Sam
                        last_name:
                          type: string
                          description: The additional approver's last name
                          example: Patel
                        email:
                          type: string
                          description: The additional approver's email address
                          example: sam.patel@company.com
              example:
                id: '4'
                name: Marketing
                type: Department
                archived: false
                approver_id: 123
                approver:
                  id: 123
                  first_name: Alex
                  last_name: Chen
                  email: alex.chen@company.com
                delegate_id: 456
                delegate:
                  id: 456
                  first_name: Jordan
                  last_name: Smith
                  email: jordan.smith@company.com
                delegate_expiry: '2025-12-31'
                all_companies: false
                companies:
                - 11454
                - 22187
                users: []
                count_users: 0
                owner_ids:
                - 789
                - 790
                owners:
                - id: 789
                  first_name: Sam
                  last_name: Patel
                  email: sam.patel@company.com
                - id: 790
                  first_name: Taylor
                  last_name: Brooks
                  email: taylor.brooks@company.com
        '400':
          description: Returns '400 Bad Request' when the request body is invalid (for example missing name, invalid owner_ids, blank/overlong `type`, or setting `type` on a Yokoy-sourced cost center).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        description: The error type identifier
                        example: bad_request
                      errors:
                        type: array
                        description: The list of validation errors
                        items:
                          type: object
                          properties:
                            reason:
                              type: string
                              description: A description of the validation failure
                              example: Field 'name' must be present and of type string
              example:
                error:
                  type: bad_request
                  errors:
                  - reason: Field 'name' must be present and of type string
  /cost_centers/bulk_update:
    patch:
      summary: Bulk update cost centers
      description: Updates a list of cost centers in a single request. You can archive or unarchive them and/or set their cost object type (`type`) when that feature is enabled for your organization. Returns the number of cost centers updated. When cost object types are enabled, provide at least one of `archive` or a non-null `type`. When the feature is not enabled, `archive` remains required.
      operationId: bulk-update-cost-centers
      tags:
      - Cost centers
      parameters:
      - name: Authorization
        in: header
        description: Your Perk API key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id_list
              properties:
                archive:
                  type: boolean
                  description: Set to 'true' to archive the cost centers, or 'false' to unarchive them. Omit to leave archive state unchanged. Required when cost object types are not enabled for your organization.
                  example: true
                id_list:
                  type: array
                  description: The IDs of the cost centers to update
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                type:
                  type: string
                  nullable: true
                  maxLength: 256
                  description: Cost object type name to set on all cost centers in `id_list`. Available only when cost object types are enabled for your organization on request. Non-empty string (max 256 characters). If a type with that name already exists (case-insensitive), it is assigned; otherwise it is created. Omit or null leaves types unchanged. When the feature is enabled, provide at least one of `archive` or a non-null `type`. If any listed cost center is Yokoy-sourced and `type` is set, the request fails with 400 (all-or-nothing).
                  example: Department
            example:
              archive: true
              id_list:
              - 1
              - 2
              - 3
              type: Department
      responses:
        '200':
          description: Returns '200 OK' and the number of cost centers updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_count:
                    type: integer
                    description: The number of cost centers successfully updated
                    example: 3
              example:
                updated_count: 3
        '400':
          description: Returns '400 Bad Request' when the request body is invalid (for example missing id_list, neither archive nor type when types are enabled, blank/overlong type, or setting type when any listed cost center is Yokoy-sourced).
          content:
            application/json:
              example:
                error:
                  type: bad_request
                  errors:
                  - reason: 'Invalid parameters. Please provide at least one of: ''archive'', ''type'''
  /cost_centers/{id}:
    get:
      summary: Get cost center
      description: Retrieves a cost center by its ID, including assigned users, approver, delegate, company scope, additional approvers (owner_ids/owners), and cost object type (`type`) when that feature is enabled for your organization.
      operationId: get-cost-center
      tags:
      - Cost centers
      parameters:
      - name: id
        in: path
        required: true
        description: The unique ID of the cost center
        schema:
          type: string
      - name: Authorization
        in: header
        description: Your Perk API key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns '200 OK' and the cost center resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique ID of the cost center
                    example: '1'
                  name:
                    type: string
                    description: The name of the cost center
                    example: Marketing
                  type:
                    type: string
                    nullable: true
                    description: Cost object type name, or null if unset. Available only when cost object types are enabled for your organization on request. Omitted from the response when the feature is not enabled.
                    example: Department
                  archived:
                    type: boolean
                    description: Indicates whether the cost center is archived
                    example: false
                  approver_id:
                    type: integer
                    example: 123
                    description: The ID of the approver user, or 'null' if not set
                  approver:
                    type: object
                    description: Approver user details, or 'null' if not set
                    properties:
                      id:
                        type: integer
                        description: The unique ID of the approver
                        example: 123
                      first_name:
                        type: string
                        description: The approver's first name
                        example: Alex
                      last_name:
                        type: string
                        description: The approver's last name
                        example: Chen
                      email:
                        type: string
                        description: The approver's email address
                        example: alex.chen@company.com
                  delegate_id:
                    type: integer
                    example: 456
                    description: The ID of the delegate user, or 'null' if not set
                  delegate:
                    type: object
                    description: Delegate user details, or null if not set
                    properties:
                      id:
                        type: integer
                        description: The unique ID of the delegate
                        example: 456
                      first_name:
                        type: string
                        description: The delegate's first name
                        example: Jordan
                      last_name:
                        type: string
                        description: The delegate's last name
                        example: Smith
                      email:
                        type: string
                        description: The delegate's email address
                        example: jordan.smith@company.com
                  delegate_expiry:
                    type: string
                    example: '2025-12-31'
                    description: The expiry date for the delegate in YYYY-MM-DD format, or 'null' if not set
                  all_companies:
                    type: boolean
                    example: true
                    description: If 'true', the cost center applies to all companies in the account
                  companies:
                    type: array
                    description: The list of companies assigned to this cost center
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The unique ID of the company
                          example: 1
                        name:
                          type: string
                          description: The name of the company
                          example: Company A
                  users:
                    type: array
                    description: The users assigned to this cost center
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The unique ID of the user
                          example: 42
                        first_name:
                          type: string
                          description: The user's first name
                          example: Alex
                        last_name:
                          type: string
                          description: The user's last name
                          example: Chen
                        email:
                          type: string
                          description: The user's email address
                          example: alex.chen@company.com
                        phone:
                          type: string
                          description: The user's phone number, or 'null' if not set
                        profile_picture:
                          type: string
                          description: The URL of the user's profile picture, or 'null' if not set
                  count_users:
                    type: integer
                    description: The number of users assigned to this cost center
                    example: 1
                  erp_code:
                    type: string
                    description: Identifier used to associate this cost center with a corresponding record in an external ERP system
                    example: CC-4210
                  owner_ids:
                    type: array
                    items:
                      type: integer
                    description: IDs of additional travel approvers
                    example:
                    - 789
                    - 790
                  owners:
                    type: array
                    description: Additional travel approver user details (id, first_name, last_name, email)
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The unique ID of the additional approver
                          example: 789
                        first_name:
                          type: string
                          description: The additional approver's first name
                          example: Sam
                        last_name:
                          type: string
                          description: The additional approver's last name
                          example: Patel
                        email:
                          type: string
                          description: The additional approver's email address
                          example: sam.patel@company.com
              example:
                id: '1'
                name: Marketing
                type: Department
                archived: false
                approver_id: 123
                approver:
                  id: 123
                  first_name: Alex
                  last_name: Chen
                  email: alex.chen@company.com
                delegate_id: 456
                delegate:
                  id: 456
                  first_name: Jordan
                  last_name: Smith
                  email: jordan.smith@company.com
                delegate_expiry: '2025-12-31'
                all_companies: false
                companies:
                - id: 11454
                  name: Company A
                - id: 22187
                  name: Company B
                users:
                - id: 42
                  first_name: Alex
                  last_name: Chen
                  email: alex.chen@company.com
                  phone: null
                  profile_picture: null
                count_users: 1
                owner_ids:
                - 789
                - 790
                owners:
                - id: 789
                  first_name: Sam
                  last_name: Patel
                  email: sam.patel@company.com
                - id: 790
                  first_name: Taylor
                  last_name: Brooks
                  email: taylor.brooks@company.com
    patch:
      summary: Update cost center
      description: Updates a cost center. You can update the name, archive status, approver, delegate, delegate expiry, additional approvers (owner_ids), and cost object type (`type`) when that feature is enabled for your organization. Passing null for 'approver_id', 'delegate_id', 'delegate_expiry', 'owner_ids', or 'type' does not clear those fields; they remain unchanged. For `owner_ids`, pass an empty array to clear.
      operationId: update-cost-center
      tags:
      - Cost centers
      parameters:
      - name: id
        in: path
        required: true
        description: The unique ID of the cost center
        schema:
          type: string
      - name: Authorization
        in: header
        description: Your Perk API key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new name for the cost center
                  example: Finance
                type:
                  type: string
                  nullable: true
                  maxLength: 256
                  description: Cost object type name to assign. Available only when cost object types are enabled for your organization on request. Non-empty string (max 256 characters). If a type with that name already exists (case-insensitive), it is assigned; otherwise it is created. Omit or null leaves the type unchanged (does not clear). If cost object types are not enabled, `type` is not a recognized field (a type-only body returns 400). Cannot be set on Yokoy-sourced cost centers (returns 400).
                  example: Department
                archive:
                  type: boolean
                  description: Set to 'true' to archive the cost center, or 'false' to unarchive it
                  example: false
                approver_id:
                  type: integer
                  description: The ID of the user to set as approver. The user must belong to one of the cost center's companies. Passing 'null' does not clear the field
                  example: 123
                delegate_id:
                  type: integer
                  description: The ID of the user to set as delegate. The delegate must belong to one of the cost center's companies. Passing 'null' does not clear the field
                  example: 456
                delegate_expiry:
                  type: string
                  description: The expiry date for the delegate in YYYY-MM-DD format. Passing 'null' does not clear the field
                  example: '2025-12-31'
                erp_code:
                  type: string
                  description: Identifier used to associate this cost center with a corresponding record in an external ERP system
                  example: CC-4210
                company_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs of companies this cost center is scoped to. Must be provided together with 'all_companies'. At least one company required when 'all_companies' is false. Ignored when 'all_companies' is true (company scope is set to all companies in the account). Omit both fields to leave unchanged.
                  example:
                  - 11454
                  - 22187
                all_companies:
                  type: boolean
                  description: Whether the cost center applies to all companies in the account. Must be provided together with 'company_ids'. When true, 'company_ids' is ignored and the cost center is scoped to all companies in the account. Omit both fields to leave unchanged.
                  example: false
                owner_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs of additional travel approvers. Omit or pass null to leave unchanged; pass an empty array to clear; pass a non-empty list to replace. Users must belong to an allowed company for the cost center and must not duplicate approver_id
                  example:
                  - 789
                  - 790
            example:
              name: Finance
              type: Department
              approver_id: 123
              delegate_id: 456
              delegate_expiry: '2025-12-31'
              owner_ids:
              - 789
              - 790
      responses:
        '200':
          description: Returns '200 OK' and the updated cost center resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique ID of the cost center
                    example: '1'
                  name:
                    type: string
                    description: The name of the cost center
                    example: Finance
                  type:
                    type: string
                    nullable: true
                    description: Cost object type name, or null if unset. Available only when cost object types are enabled for your organization on request. Omitted from the response when the feature is not enabled.
                    example: Department
                  archived:
                    type: boolean
                    description: Indicates whether the cost center is archived
                    example: false
                  approver_id:
                    type: integer
                    description: The ID of the approver user, or 'null' if not set
                    example: 123
                  approver:
                    type: object
                    description: Approver user details, or 'null' if not set
                    properties:
                      id:
                        type: integer
                        description: The unique ID of the approver
                        example: 123
                      first_name:
                        type: string
                        description: The approver's first name
                        example: Alex
                      last_name:
                        type: string
                        description: The approver's last name
                        example: Chen
                      email:
                        type: string
                        description: The approver's email address
                        example: alex.chen@company.com
                  delegate_id:
                    type: integer
                    description: The ID of the delegate user, or 'null' if not set
                    example: 456
                  delegate:
                    type: object
                    description: Delegate user details, or 'null' if not set
                    properties:
                      id:
                        type: integer
                        description: The unique ID of the delegate
                        example: 456
                      first_name:
                        type: string
                        description: The delegate's first name
                        example: Jordan
                      last_name:
                        type: string
                        description: The delegate's last name
                        example: Smith
                      email:
                        type: string
                        description: The delegate's email address
                        example: jordan.smith@company.com
                  delegate_expiry:
                    type: string
                    description: The expiry date for the delegate in YYYY-MM-DD format, or 'null' if not set
                    example: '2025-12-31'
                  users:
                    type: array
                    description: The users assigned to this cost center
                    items:
                      type: object
                  count_users:
                    type: integer
                    description: The number of users assigned to this cost center
                    example: 1
                  erp_code:
                    type: string
                    description: Identifier used to associate this cost center with a corresponding record in an external ERP system
                    example: CC-4210
                  all_companies:
                    type: boolean
                    description: If 'true', the cost center applies to all companies in the account.
                    example: false
                  companies:
                    type: array
                    description: The IDs of companies assigned to this cost center
                    items:
                      type: integer
                    example:
                    - 1
                    - 2
                  owner_ids:
                    type: array
                    items:
                      type: integer
                    description: IDs of additional travel approvers
                    example:
                    - 789
                    - 790
                  owners:
                    type: array
                    description: Additional travel approver user details (id, first_name, last_name, email)
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The unique ID of the additional approver
                          example: 789
                        first_name:
                          type: string
                          description: The additional approver's first name
                          example: Sam
                        last_name:
                          type: string
                          description: The additional approver's last name
                          example: Patel
                        email:
                          type: string
                          description: The additional approver's email address
                          example: sam.patel@company.com
              example:
                id: '1'
                name: Finance
                type: Department
                archived: false
                approver_id: 123
                approver:
                  id: 123
                  first_name: Alex
                  last_name: Chen
                  email: alex.chen@company.com
                delegate_id: 456
                delegate:
                  id: 456
                  first_name: Jordan
                  last_name: Smith
                  email: jordan.smith@company.com
                delegate_expiry: '2025-12-31'
                all_companies: false
                companies:
                - 11454
                - 22187
                users: []
                count_users: 1
                owner_ids:
                - 789
                - 790
                owners:
                - id: 789
                  first_name: Sam
                  last_name: Patel
                  email: sam.patel@company.com
                - id: 790
