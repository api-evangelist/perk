openapi: 3.2.0
info:
  title: Perk Users API
  version: '1.5'
  description: 'Operations tagged Users across 2 of this provider''s published API definitions: perk-scim-server-openapi.yml, perk-travelperk-api-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.perk.com/api/v2/scim
- url: https://api.travelperk.com/
security:
- sec0: []
tags:
- name: Users
paths:
  /Users:
    post:
      summary: Create a new user
      description: Creates a new user in Perk.
      operationId: create-a-new-user
      responses:
        '201':
          description: Returns `201 Created` and the newly created user resource.
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"schemas\": [\n    \"urn:ietf:params:scim:schemas:core:2.0:User\",\n    \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\"\n  ],\n  \"name\": {\n    \"givenName\": \"Marlen\",\n    \"familyName\": \"Col\",\n    \"middleName\": \"\",\n    \"honorificPrefix\": \"\"\n  },\n  \"locale\": \"en\",\n  \"preferredLanguage\": \"en\",\n  \"title\": \"Manager\",\n  \"externalId\": \"123455667\",\n  \"id\": \"29\",\n  \"groups\": [],\n  \"active\": true,\n  \"userName\": \"marlen.col@mycompany.com\",\n  \"phoneNumbers\": [\n    {\n      \"value\": \"+34 1234567\",\n      \"type\": \"work\"\n    }\n  ],\n  \"meta\": {\n    \"resourceType\": \"User\",\n    \"created\": \"2020-04-01T22:24:44.137082+00:00\",\n    \"lastModified\": \"2020-04-01T22:24:44.137082+00:00\",\n    \"location\": \"http://app.perk.com/api/v2/scim/Users/29\"\n  },\n  \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\": {\n    \"costCenter\": \"Marketing\",\n    \"manager\": {\n            \"value\": \"1234\",\n            \"$ref\": \"http://app.perk.com/api/v2/scim/Users/1234\",\n            \"displayName\": \"John Johnson\"\n        },\n  },\n  \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\": {\n    \"gender\": \"M\",\n  \t\"dateOfBirth\": \"1980-02-02\",\n    \"travelPolicy\": \"Marketing travel policy\",\n    \"invoiceProfiles\": [\n      {\n        \"value\": \"My Company Ltd\"\n      }\n    ],\n    \"company\": \"MyCompany USA, Ltd\",\n    \"emergencyContact\": {\n      \"name\": \"Jane Goodie\",\n      \"phone\": \"+34 9874637\"\n    },\n    \"countryOfResidence\": \"ES\",\n    \"travelDocuments\": [\n      {\n      \t\"documentType\": \"passport\",\n      \t\"documentNumber\": \"abcedf12345\",\n      \t\"givenName\": \"Josh\",\n      \t\"middleName\": \"\",\n        \"familyName\": \"Smith\",\n      \t\"gender\": \"M\",\n      \t\"issuingCountry\": \"ES\",\n      \t\"issuingDate\": \"1999-12-05\",\n      \t\"expirationDate\": \"2042-09-08\",\n      \t\"citizenship\": \"ES\"\n    \t}\n    ]\n  }\n}"
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n  --url https://app.perk.com/api/v2/scim/Users \\\n  --header 'content-type: application/json'\\\n  --header 'Authorization: apikey <YOUR API KEY>'\\\n  -d '\n{\n  \"schemas\": [\n    \"urn:ietf:params:scim:schemas:core:2.0:User\",\n    \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\",\n    \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User\",\n\t\t\"urn:ietf:params:scim:schemas:extension:perkcustomfields:2.0:User\"\n  ],\n  \"name\": {\n    \"givenName\": \"Marlen\",\n    \"familyName\": \"Col\",\n    \"middleName\": \"\",\n    \"honorificPrefix\": \"\"\n  },\n  \"locale\": \"en\",\n  \"preferredLanguage\": \"en\",\n  \"title\": \"Manager\",\n  \"externalId\": \"123455667\",\n  \"groups\": [],\n  \"active\": true,\n  \"userName\": \"marlaen.col@mycompany.com\",\n  \"phoneNumbers\": [\n    {\n      \"value\": \"+34 6412345\",\n      \"type\": \"work\"\n    }\n  ],\n  \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\": {\n    \"costCenter\": \"Marketing\",\n    \"manager\": {\n        \"value\":{\n            \"value\": \"1234\"\n        }\n    }\n  },\n  \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User\": {\n    \"gender\": \"M\",\n    \"dateOfBirth\": \"1980-02-02\",\n    \"travelPolicy\": \"Marketing travel policy\",\n    \"invoiceProfiles\": [\n      {\n        \"value\": \"My Company Ltd\"\n      }\n    ],\n    \"company\": \"MyCompany USA, Ltd\",\n    \"lineManagerEmail\": \"john.manager@mycompany.com\",\n    \"emergencyContact\": {\n      \"name\": \"Jane Goodie\",\n      \"phone\": \"+34 9874637\"\n    },\n    \"countryOfResidence\": \"ES\",\n\t\t\"uniqueId\": \"A unique ID,\n    \"travelDocuments\": [\n      {\n      \t\"documentType\": \"passport\",\n      \t\"documentNumber\": \"abcedf12345\",\n      \t\"givenName\": \"Josh\",\n      \t\"middleName\": \"\",\n        \"familyName\": \"Smith\",\n      \t\"gender\": \"M\",\n      \t\"issuingCountry\": \"ES\",\n      \t\"issuingDate\": \"1999-12-05\",\n      \t\"expirationDate\": \"2042-09-08\",\n      \t\"citizenship\": \"ES\"\n    \t}\n    ]\n  },\n\t\"urn:ietf:params:scim:schemas:extension:perkcustomfields:2.0:User\": {\n    \"cf_brand_138bcf1e-ce81-4eb6-b5f2-d62f8c817ac7\": \"100\",\n    \"cf_market_fc93b012-a592-4580-b551-39d78294d35f\": \"400\"\n  }\n}\n'"
          name: cURL
        samples-languages:
        - curl
      tags:
      - Users
    get:
      summary: List users (with filtering)
      description: Lists all users associated with this account.
      operationId: list-all-users
      parameters:
      - name: count
        in: query
        description: Specifies the desired maximum number of query results per page. 100 is the maximum number of resources per page. The default value is 10.
        schema:
          type: integer
          format: int32
      - name: startIndex
        in: query
        description: The 1-based index of the first query result. A value less than 1 is interpreted as 1.
        schema:
          type: integer
          format: int32
      - name: filter
        in: query
        description: Filter expression to get a subset of users. When specified, only the users matching the filter expression are returned.
        schema:
          type: string
      responses:
        '200':
          description: Returns `200 OK` and a paginated list of users.
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"schemas\": [\n    \"urn:ietf:params:scim:api:messages:2.0:ListResponse\"\n  ],\n  \"totalResults\": 2,\n  \"itemsPerPage\": 2,\n  \"startIndex\": 1,\n  \"Resources\": [\n    {\n      \"schemas\": [\n        \"urn:ietf:params:scim:schemas:core:2.0:User\",\n        \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\",\n        \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User\"\n      ],\n      \"name\": {\n        \"givenName\": \"Dan\",\n        \"familyName\": \"Morrison\",\n        \"middleName\": \"\",\n        \"honorificPrefix\": \"MR\"\n      },\n      \"locale\": \"en-gb\",\n      \"preferredLanguage\": \"en\",\n      \"title\": \"Boss\",\n      \"externalId\": \"12\",\n      \"id\": \"7\",\n      \"groups\": [],\n      \"active\": true,\n      \"userName\": \"dan.morrison@mycompany.com\",\n      \"phoneNumbers\": [\n        {\n          \"value\": \"+34 234567654\",\n          \"type\": \"work\"\n        }\n      ],\n      \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\": {\n        \"costCenter\": \"Marketing\"\n      },\n      \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User\": {\n        \"gender\": \"M\",\n        \"dateOfBirth\": \"1991-04-23\",\n        \"travelPolicy\": \"Marketing policy #1\",\n        \"invoiceProfiles\": [\n          {\n            \"value\": \"MyCompany Ltd\"\n          }\n        ],\n        \"company\": \"MyCompany USA, Ltd\",\n        \"emergencyContact\": {\n          \"name\": \"Jess Michigan\",\n          \"phone\": \"+34 9874637\"\n        },\n        \"approvers\": [\n          {\n      \t\t  \"value\": \"123\",\n            \"$ref\": \"https://app.perk.com/api/v2/scim/Users/123\",\n            \"displayName\": \"Jack Jackson\",\n            \"condition\": \"in_policy\"\n    \t\t  }\n        ]\n      }\n    },\n    {\n      \"schemas\": [\n        \"urn:ietf:params:scim:schemas:core:2.0:User\",\n        \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\",\n        \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User\"\n      ],\n      \"name\": {\n        \"givenName\": \"Mathew\",\n        \"familyName\": \"Roberts\",\n        \"middleName\": \"\",\n        \"honorificPrefix\": \"MRS\"\n      },\n      \"locale\": \"en-gb\",\n      \"preferredLanguage\": \"en\",\n      \"title\": \"Office Manager\",\n      \"externalId\": \"11\",\n      \"id\": \"8\",\n      \"groups\": [],\n      \"active\": true,\n      \"userName\": \"mathew.robersr@mycompany.com\",\n      \"phoneNumbers\": {\n        \"value\": \"+34 8453234\",\n         \"type\": \"work\"\n      },\n      \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\": {\n        \"costCenter\": null\n      },\n      \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User\": {\n        \"gender\": \"M\",\n        \"dateOfBirth\": \"1991-04-23\",\n        \"travelPolicy\": \"Office Management Policy #2\",\n        \"invoiceProfiles\": [\n          {\n            \"value\": \"MyCompany Ltd\"\n          }\n        ],\n        \"company\": \"MyCompany USA, Ltd\",\n        \"emergencyContact\": {\n          \"name\": \"Jim Parker\",\n          \"phone\": \"+34 5434567\"\n        },\n        \"approvers\": [\n          {\n      \t\t  \"value\": \"456\",\n            \"$ref\": \"https://app.perk.com/api/v2/scim/Users/456\",\n            \"displayName\": \"John Johnson\",\n            \"condition\": \"always\"\n    \t\t  }\n        ],\n        \"countryOfResidence\": \"ES\",\n        \"travelDocuments\": [\n          {\n            \"documentType\": \"passport,\n            \"documentNumber\": \"abcedf12345\",\n            \"givenName\": \"Josh\",\n            \"middleName\": \"\",\n            \"familyName\": \"Smith\",\n            \"gender\": \"M\",\n            \"issuingCountry\": \"ES\",\n            \"issuingDate\": \"1999-12-05\",\n            \"expirationDate\": \"2042-09-08\",\n            \"citizenship\": \"ES\",\n          }\n        ]\n      }\n    }\n  ]\n}"
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --get \\\n  --url https://app.perk.com/api/v2/scim/Users \\\n  --data-urlencode \"filter=userName eq \\\"some-user@testcompany.com\\\"\" \\\n  --header \"Authorization: ApiKey <YOUR API KEY>\""
          name: Filter by userName
        - language: curl
          code: "curl --get \\\n  --url https://app.perk.com/api/v2/scim/Users \\\n  --data-urlencode \"filter=externalId eq \\\"6fa62893-1797-4b45-9297-63f562d49b9a\\\"\" \\\n  --header \"Authorization: ApiKey <YOUR API KEY>\""
          name: Filter by externalId
        samples-languages:
        - curl
      tags:
      - Users
    servers:
    - url: https://app.perk.com/api/v2/scim
  /Users/{id}:
    patch:
      summary: Update a user
      description: Updates attributes for an existing user in Perk, overwriting values for specified attributes. Attributes that are not provided in the request remain unchanged.
      operationId: update-a-user
      parameters:
      - name: id
        in: path
        description: Unique user identifier. The value is generated by Perk and returned during user creation.
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: Returns `200 OK` and the updated user resource.
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"schemas\": [\n    \"urn:ietf:params:scim:schemas:core:2.0:User\",\n    \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\",\n    \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User\"\n  ],\n  \"name\": {\n    \"givenName\": \"Marlen\",\n    \"familyName\": \"Col\",\n    \"middleName\": \"\",\n    \"honorificPrefix\": \"\"\n  },\n  \"locale\": \"en\",\n  \"preferredLanguage\": \"en\",\n  \"title\": \"Engineer\",\n  \"externalId\": \"123455667\",\n  \"id\": \"29\",\n  \"groups\": [],\n  \"active\": true,\n  \"username\": \"marlaen.col@mycompany.com\",\n  \"phoneNumbers\": [],\n  \"meta\": {\n    \"resourceType\": \"User\",\n    \"created\": \"2020-04-01T22:24:44.137082+00:00\",\n    \"lastModified\": \"2020-04-01T22:24:44.137082+00:00\",\n    \"location\": \"http://app.perk.com/api/v2/scim/Users/29\"\n  },\n  \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\": {\n    \"costCenter\": \"Cost Center\",\n    \"manager\": {\n            \"value\": \"456\",\n            \"$ref\": \"https://app.perk.com/api/v2/scim/Users/456\",\n            \"displayName\": \"John Manager\"\n        },\n  },\n  \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User\": {\n    \"gender\": \"M\",\n    \"dateOfBirth\": \"1980-02-02\",\n    \"travelPolicy\": \"Travel Policy\",\n    \"invoiceProfiles\": [\n        {\n          \"value\": \"Invoice Profile\"\n        }\n      ],\n    \"emergencyContact\": {\n      \"name\": \"Jane Goodie\",\n      \"phone\": \"+34 9874637\"\n    },\n    \"uniqueId\": \"A unique ID\",\n    \"company\": \"MyCompany US, LTD.\",\n    \"approvers\": [],\n    \"countryOfResidence\": \"ES\",\n    \"travelDocuments\": [\n      {\n      \t\"documentType\": \"passport\",\n      \t\"documentNumber\": \"abcedf12345\",\n      \t\"givenName\": \"Josh\",\n      \t\"middleName\": \"\",\n        \"familyName\": \"Smith\",\n      \t\"gender\": \"M\",\n      \t\"issuingCountry\": \"ES\",\n      \t\"issuingDate\": \"1999-12-05\",\n      \t\"expirationDate\": \"2042-09-08\",\n      \t\"citizenship\": \"ES\"\n    \t}\n    ]\n  }\n}"
        '400':
          description: Returns `400 Bad request` and a SCIM error describing the invalid attribute.
          content:
            application/json:
              examples:
                ReadOnly Field:
                  value: "{\n  \"schemas\": \"urn:ietf:params:scim:api:messages:2.0:Error\",\n  \"detail\": \"SCIM data 'id' cannot be updated\",\n  \"status\": 400,\n  \"scimType\": \"invalidValue\"\n}"
                Result:
                  value: "{\n  \"schemas\": \"urn:ietf:params:scim:api:messages:2.0:Error\",\n\t\"detail\": \"Attribute 'name' is mandatory, can not be None.\",\n\t\"status\": 400,\n  \"scimType\": \"invalidValue\"\n}            \n"
              schema:
                oneOf:
                - title: ReadOnly field
                  type: object
                  properties:
                    schemas:
                      type: string
                      example: urn:ietf:params:scim:api:messages:2.0:Error
                    detail:
                      type: string
                      example: SCIM data 'id' cannot be updated
                    status:
                      type: integer
                      example: 400
                      default: 0
                    scimType:
                      type: string
                      example: invalidValue
                - type: object
                  properties:
                    schemas:
                      type: string
                      example: urn:ietf:params:scim:api:messages:2.0:Error
                    detail:
                      type: string
                      example: Value {value} is not valid for attribute 'gender'
                    status:
                      type: integer
                      example: 400
                      default: 0
                    scimType:
                      type: string
                      example: invalidValue
                - type: object
                  properties:
                    schemas:
                      type: string
                      example: urn:ietf:params:scim:api:messages:2.0:Error
                    detail:
                      type: string
                      example: Attribute 'name' is mandatory, cannot be None.
                    status:
                      type: integer
                      example: 400
                      default: 0
                    scimType:
                      type: string
                      example: invalidValue
        '404':
          description: Returns `404 Not found` and a SCIM error when no user matches the ID.
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"schemas\": \"urn:ietf:params:scim:api:messages:2.0:Error\",\n  \"detail\": \"User '1234' not found\",\n  \"status\": 404\n}"
              schema:
                type: object
                properties:
                  schemas:
                    type: string
                    example: urn:ietf:params:scim:api:messages:2.0:Error
                  detail:
                    type: string
                    example: User '1234' not found
                    description: Human-readable description of the error.
                  status:
                    type: integer
                    example: 404
                    default: 0
                    description: HTTP error status code (4xx range).
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request PATCH \\\n  --url https://app.perk.com/api/v2/scim/Users/1234 \\\n  --header 'content-type: application/json'\\\n  --header 'Authorization: apikey <YOUR API KEY>' \\\n  -d '{\"schemas\": \"urn:ietf:params:scim:api:messages:2.0:PatchOp\",\n\"Operations\": [{\n  \"op\": \"replace\",\n  \"path\": \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:manager\",\n  \"value\": {\n  \t\"value\": \"456\"\n    }\n}\n]}\n'"
          name: Add a manager
        - language: curl
          code: "curl --request PATCH \\\n  --url https://app.perk.com/api/v2/scim/Users/1234 \\\n  --header 'content-type: application/json'\\\n  --header 'Authorization: apikey <YOUR API KEY>' \n  -d '{\"schemas\": \"urn:ietf:params:scim:api:messages:2.0:PatchOp\",\n\"Operations\": [\n{\n  \"op\": \"replace\",\n  \"path\": \"active\",\n  \"value\": false\n}]}\n'"
          name: Deactivate a user
        - language: curl
          code: "curl --request PATCH \\\n  --url https://app.perk.com/api/v2/scim/Users/1234 \\\n  --header 'content-type: application/json'\\\n  --header 'Authorization: apikey <YOUR API KEY>' \n  -d '{\"schemas\": \"urn:ietf:params:scim:api:messages:2.0:PatchOp\",\n\"Operations\": [\n{\n  \"op\": \"remove\",\n  \"path\": \"phoneNumbers\",\n}]}\n'"
          name: Delete a phoneNumber
        - language: curl
          code: "  curl --request PATCH \\\n  --url https://app.perk.com/api/v2/scim/Users/1234 \\\n  --header 'content-type: application/json'\\\n  --header 'Authorization: apikey <YOUR API KEY>' \n  -d '{\"schemas\": \"urn:ietf:params:scim:api:messages:2.0:PatchOp\",\n\"Operations\": [\n{\n  \"op\": \"replace\",\n  \"path\": \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User:emergencyContact\",\n  \"value\": {\n    \"name\": \"Jane Goodie\",\n    \"phone\": \"+34 9874637\"\n  }\n}]}"
          name: Update a complex attribute
        - language: curl
          code: "curl --request PATCH \\\n  --url https://app.perk.com/api/v2/scim/Users/1234 \\\n  --header 'Authorization: apikey <YOUR API KEY>' \n  -d '{\"schemas\": \"urn:ietf:params:scim:api:messages:2.0:PatchOp\",\n\"Operations\": [\n{\n  \"op\": \"add\",\n  \"path\": \"title\",\n  \"value\": \"Engineer\"\n}\n]}\n'"
          name: Add a title
        - language: curl
          code: "curl --request PATCH \\\n  --url https://app.perk.com/api/v2/scim/Users/1234 \\\n  --header 'content-type: application/json'\\\n  --header 'Authorization: apikey <YOUR API KEY>' \\\n  -d '{\"schemas\": \"urn:ietf:params:scim:api:messages:2.0:PatchOp\",\n\"Operations\": [{\n  \"op\": \"replace\",\n  \"path\": \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User:lineManagerEmail\",\n  \"value\": \"new_manager@mycompany.com\"\n}\n]}\n'"
          name: Add manager using lineManagerEmail
        - code: "curl --request PATCH \\\n  --url https://app.perk.com/api/v2/scim/Users/1234 \\\n  --header 'content-type: application/json' \\\n  --header 'Authorization: apikey <YOUR API KEY>' \\\n  -d '{\n  \"schemas\": \"urn:ietf:params:scim:api:messages:2.0:PatchOp\",\n  \"Operations\": [{\n    \"op\": \"replace\",\n    \"path\": \"urn:ietf:params:scim:schemas:extension:perkcustomfields:2.0:User:cf_brand_138bcf1e-ce81-4eb6-b5f2-d62f8c817ac7\",\n    \"value\": \"100\"\n  }]\n}'"
          language: shell
          name: Update custom field
        samples-languages:
        - curl
        - shell
      tags:
      - Users
    put:
      summary: Replace a user
      description: Replaces all of a user's attributes.
      operationId: replace-a-user
      parameters:
      - name: id
        in: path
        description: Unique user identifier. The value is generated by Perk and returned during user creation.
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '201':
          description: Returns `201 Created` and the user resource.
          content:
            application/json:
              examples:
                Result:
                  value: "\": [\n        {\n{\n  \"schemas\": [\n    \"urn:ietf:params:scim:schemas:core:2.0:User\",\n    \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\",\n    \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User\",\n    \"urn:ietf:params:scim:schemas:extension:perkcustomfields:2.0:User\"\n  ],\n  \"name\": {\n    \"givenName\": \"Marlen\",\n    \"familyName\": \"Col\",\n    \"middleName\": \"\",\n    \"honorificPrefix\": \"\"\n  },\n  \"locale\": \"en\",\n  \"preferredLanguage\": \"en\",\n  \"title\": \"Manager\",\n  \"externalId\": \"123455667\",\n  \"id\": \"29\",\n  \"groups\": [],\n  \"active\": true,\n  \"username\": \"marlen.col@mycompany.com\",\n  \"phoneNumbers\": [\n    {\n      \"value\": \"+34 1234567\",\n      \"type\": \"work\"\n    }\n  ],\n  \"meta\": {\n    \"resourceType\": \"User\",\n    \"created\": \"2020-04-01T22:24:44.137082+00:00\",\n    \"lastModified\": \"2020-04-01T22:24:44.137082+00:00\",\n    \"location\": \"http://app.perk.com/api/v2/scim/Users/29\"\n  },\n  \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\": {\n    \"costCenter\": \"Marketing\",\n    \"manager\": {\n      \"value\": \"1234\",\n      \"$ref\": \"https://app.perk.com/api/v2/scim/Users/1234\",\n      \"displayName\": \"John Johnson\"\n    }\n  },\n  \"urn:ietf:params:scim:schemas:extension:travelperk:2.0:User\": {\n    \"gender\": \"M\",\n    \"dateOfBirth\": \"1980-02-02\",\n    \"travelPolicy\": \"Marketing travel policy\",\n    \"invoiceProfiles\": [\n      {\n        \"value\": \"My Company Ltd\"\n      }\n    ],\n    \"emergencyContact\": {\n      \"name\": \"Jane Goodie\",\n      \"phone\": \"+34 9874637\"\n    },\n    \"countryOfResidence\": \"ES\",\n    \"travelDocuments\": [\n      {\n        \"documentType\": \"passport\",\n        \"documentNumber\": \"abcedf12345\",\n        \"givenName\": \"Josh\",\n        \"middleName\": \"\",\n        \"familyName\": \"Smith\",\n        \"gender\": \"M\",\n        \"type\"