openapi: 3.2.0
info:
  title: scim-server Schemas API
  version: '1.5'
  description: Use this API to provision and manage users in Perk via System for Cross-domain Identity Management (SCIM 2.0).
servers:
- url: https://app.perk.com/api/v2/scim
security:
- sec0: []
tags:
- name: Schemas
paths:
  /Schemas:
    get:
      summary: List all schemas
      description: Lists all schemas and their attributes.
      operationId: list-all-schemas
      responses:
        '200':
          description: Returns `200 OK` and a list of all schema definitions.
          content:
            application/json:
              examples:
                Result:
                  value:
                    schemas:
                    - urn:ietf:params:scim:api:messages:2.0:ListResponse
                    totalResults: 4
                    itemsPerPage: 10
                    startIndex: 1
                    Resources:
                    - id: urn:ietf:params:scim:schemas:core:2.0:User
                      name: User
                      description: User Account Schema
                      attributes:
                      - name: name
                        type: complex
                        multiValued: false
                        description: The components of the user's real name. Providers MAY return just the full name as a single string in the formatted sub-attribute, or they MAY return just the individual component attributes using the other sub-attributes, or they MAY return both. If both variants are returned, they SHOULD be describing the same name, with the formatted name indicating how the component attributes should be combined.
                        required: true
                        subAttributes:
                        - name: familyName
                          type: string
                          multiValued: false
                          description: The family name of the User, or last name in most Western languages (e.g., 'Jensen' given the full name 'Ms. Barbara J Jensen, III').
                          required: true
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: givenName
                          type: string
                          multiValued: false
                          description: The given name of the User, or first name in most Western languages (e.g., 'Barbara' given the full name 'Ms. Barbara J Jensen, III').
                          required: true
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: middleName
                          type: string
                          multiValued: false
                          description: The middle name(s) of the User (e.g., 'Jane' given the full name 'Ms. Barbara J Jensen, III').
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: honorificPrefix
                          type: string
                          multiValued: false
                          description: The honorific prefix(es) of the User, or title in most Western languages (e.g., 'Ms.' given the full name 'Ms. Barbara J Jensen, III').
                          required: false
                          caseExact: true
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: externalId
                        type: string
                        multiValued: false
                        description: ''
                        required: false
                        mutability: readWrite
                        returned: default
                        uniqueness: server
                      - name: title
                        type: string
                        multiValued: false
                        description: The user's title, such as "Vice President."
                        required: false
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: preferredLanguage
                        type: string
                        multiValued: false
                        description: Indicates the User's preferred written or spoken language. Generally used for selecting a localized user interface; e.g., 'en_US' specifies the language English and country US.
                        required: false
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                        canonicalValues:
                        - en
                        - es
                        - fr
                        - de
                      - name: locale
                        type: string
                        multiValued: false
                        description: Used to indicate the User's default location for purposes of localizing items such as currency, date time format, or numerical representations.
                        required: false
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: active
                        type: boolean
                        multiValued: false
                        description: A Boolean value indicating the User's administrative status.
                        required: true
                        mutability: readWrite
                        returned: default
                      - name: phoneNumbers
                        type: complex
                        multiValued: true
                        description: Phone numbers for the User. The value SHOULD be canonicalized by the service provider according to the format specified in RFC 3966, e.g., 'tel:+1-201-555-0123'. Canonical type values of 'work', 'home', 'mobile', 'fax', 'pager', and 'other'.
                        required: false
                        subAttributes:
                        - name: value
                          type: string
                          multiValued: false
                          description: Phone number of the User.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: type
                          type: string
                          multiValued: false
                          description: A label indicating the attribute's function, e.g., 'work', 'home', 'mobile'.
                          required: false
                          caseExact: false
                          canonicalValues:
                          - work
                          - home
                          - mobile
                          - fax
                          - pager
                          - other
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        mutability: readWrite
                        returned: default
                      - name: id
                        type: string
                        multiValued: false
                        description: Identification number in Perk
                        required: false
                        mutability: readOnly
                        returned: default
                      - name: groups
                        type: list
                        multiValued: true
                        description: Groups - Currently not supported by Perk
                        required: false
                        mutability: readOnly
                        returned: default
                      - name: meta
                        type: complex
                        multiValued: false
                        description: Server-generated metadata
                        required: false
                        mutability: readOnly
                        subAttributes:
                        - name: resourceType
                          type: string
                          multiValued: false
                          description: The name of the resource type of the resource
                          required: false
                          mutability: readOnly
                          returned: default
                          caseExact: 'true'
                        - name: created
                          type: string
                          multiValued: false
                          description: The DateTime that the resource was added to the service provider.
                          required: false
                          mutability: readWrite
                          returned: default
                        - name: lastModified
                          type: string
                          multiValued: false
                          description: The most recent DateTime that the details of this resource were updated at the service provider
                          required: false
                          mutability: readWrite
                          returned: default
                        - name: location
                          type: string
                          multiValued: false
                          description: The URI of the resource being returned.
                          required: false
                          mutability: readWrite
                          returned: default
                        - name: version
                          type: string
                          multiValued: false
                          description: ' The version of the resource being returned.'
                          required: false
                          mutability: readWrite
                          returned: default
                        returned: default
                      - name: userName
                        type: string
                        multiValued: false
                        description: Unique identifier for the User, typically used by the user to directly authenticate to the service provider. The userName value and it MUST be a non-empty and valid email address of the user, as well as be unique across the service provider's entire set of Users.
                        required: true
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: server
                      meta:
                        resourceType: Schema
                        location: https://app.perk.com/api/v2/scim/Schemas/urn:ietf:params:scim:schemas:core:2.0:User
                      schemaExtensions:
                      - schema: urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                        required: false
                      - schema: urn:ietf:params:scim:schemas:extension:travelperk:2.0:User
                        required: false
                    - id: urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                      name: Enterprise User
                      description: Enterprise User Schema
                      attributes:
                      - name: costCenter
                        type: string
                        multiValued: false
                        description: Identifies the name of a cost center. The cost center should exist in Perk
                        required: false
                        caseExact: true
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: manager
                        type: complex
                        multiValued: false
                        description: An object that represents the user's manager. Used to create approval processes in Perk, setting the manager as approver for the user.
                        required: false
                        subAttributes:
                        - name: value
                          type: string
                          multiValued: false
                          description: The manager's Perk ID.
                          required: false
                          caseExact: true
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: displayName
                          type: string
                          multiValued: false
                          description: Human readable name of the manager.
                          required: false
                          caseExact: true
                          mutability: readOnly
                          returned: default
                          uniqueness: none
                        - name: $ref
                          type: string
                          multiValued: false
                          description: The URI that refers to the manager within Perk.
                          required: false
                          caseExact: true
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      meta:
                        resourceType: Schema
                        location: https://app.perk.com/api/v2/scim/Schemas/urn:ietf:params:scim:schemas:extension:enterprise:2.0:User
                    - id: urn:ietf:params:scim:schemas:extension:travelperk:2.0:User
                      name: Custom User
                      description: Custom User Schema
                      attributes:
                      - name: gender
                        type: string
                        multiValued: false
                        description: ''
                        required: false
                        caseExact: false
                        canonicalValues:
                        - M
                        - F
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: dateOfBirth
                        type: string
                        multiValued: false
                        description: Date of birth of the user. Should be a string with the format 'YYYY-MM-DD', otherwise the value will be rejected
                        required: false
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: travelPolicy
                        type: string
                        multiValued: false
                        description: Identifies the name of a travel policy. The travel policy should exist in Perk
                        required: false
                        caseExact: true
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: invoiceProfiles
                        type: complex
                        multiValued: true
                        description: Invoice profiles for a user. Typically one value only. It should exist in Perk.
                        required: false
                        subAttributes:
                        - name: value
                          type: string
                          multiValued: false
                          description: Invoice profiles for a user.
                          required: false
                          caseExact: true
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: emergencyContact
                        type: complex
                        multiValued: false
                        description: The user's emergency contact. Contains their name and phone number.
                        required: false
                        subAttributes:
                        - name: name
                          type: string
                          multiValued: false
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                          description: The full name of the user's emergency contact
                        - name: phone
                          type: string
                          multiValued: false
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                          description: The phone number of the user's emergency contact
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: approvers
                        type: complex
                        multiValued: true
                        description: Approvers for the User. They need to exist in Perk.
                        required: false
                        subAttributes:
                        - name: value
                          type: string
                          multiValued: false
                          description: The approver's Perk ID.
                          required: false
                          caseExact: true
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: displayName
                          type: string
                          multiValued: false
                          description: Human readable name of the approver.
                          required: false
                          caseExact: true
                          mutability: readOnly
                          returned: default
                          uniqueness: none
                        - name: $ref
                          type: string
                          multiValued: false
                          description: The URI that refers to the approver within Perk.
                          required: false
                          caseExact: true
                          mutability: readOnly
                          returned: default
                          uniqueness: none
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: countryOfResidence
                        type: string
                        multiValued: false
                        description: Identifies the country of residence of the user.
                        required: false
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: travelDocuments
                        type: complex
                        multiValued: true
                        description: Travel documents of the user.
                        required: false
                        subAttributes:
                        - name: documentType
                          type: string
                          multiValued: false
                          description: The type of the document. It can be either passport or id.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: givenName
                          type: string
                          multiValued: false
                          description: The first name of the user as it appears on the document.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: familyName
                          type: string
                          multiValued: false
                          description: The last name of the user as it appears on the document.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: middleName
                          type: string
                          multiValued: false
                          description: The middle name of the user as it appears on the document.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: gender
                          type: string
                          multiValued: false
                          description: The gender of the the user as it appears on the document.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: issuingCountry
                          type: string
                          multiValued: false
                          description: The country where the document was issued.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: issuingDate
                          type: string
                          multiValued: false
                          description: The date when the document was issued.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: expirationDate
                          type: string
                          multiValued: false
                          description: The expiration date of the document.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: citizenship
                          type: string
                          multiValued: false
                          description: The citizenship of the user as steated in the document.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        - name: documentNumber
                          type: string
                          multiValued: false
                          description: The number of the document.
                          required: false
                          caseExact: false
                          mutability: readWrite
                          returned: default
                          uniqueness: none
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      meta:
                        resourceType: Schema
                        location: https://app.perk.com/api/v2/scim/Schemas/urn:ietf:params:scim:schemas:extension:travelperk:2.0:User
                    - id: urn:ietf:params:scim:schemas:extension:perkcustomfields:2.0:User
                      name: Perk Custom Fields
                      description: Custom fields provisionable via SCIM
                      attributes:
                      - name: cf_brand_138bcf1e-ce81-4eb6-b5f2-d62f8c817ac7
                        type: string
                        multiValued: false
                        description: 'Custom field: Brand'
                        required: false
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: cf_market_fc93b012-a592-4580-b551-39d78294d35f
                        type: string
                        multiValued: false
                        description: 'Custom field: Market'
                        required: false
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      meta:
                        resourceType: Schema
                        location: https://app.perk.com/api/v2/scim/Schemas/urn:ietf:params:scim:schemas:extension:perkcustomfields:2.0:User
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      example: urn:ietf:params:scim:api:messages:2.0:ListResponse
                  totalResults:
                    type: integer
                    example: 3
                    default: 0
                  itemsPerPage:
                    type: integer
                    example: 10
                    default: 0
                  startIndex:
                    type: integer
                    example: 1
                    default: 0
                  Resources:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: urn:ietf:params:scim:schemas:core:2.0:User
                        name:
                          type: string
