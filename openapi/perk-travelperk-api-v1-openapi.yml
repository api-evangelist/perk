        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: A name that identifies this subscription. This name will be sent on the notification JSON payload.
                url:
                  type: string
                  description: Target URL where notification JSON payloads will be POSTed.
                secret:
                  type: string
                  description: A secret only know by the user and TravelPerk. This secret will be used to sign the payload and send it in the `Tk-Signature` header.
                events:
                  type: array
                  description: A list of event names to which the user is subscribing to.
                  items:
                    type: string
