                        type: boolean
                        example: true
                        default: true
                      maxResults:
                        type: integer
                        example: 50
                        default: 0
                  changePassword:
                    type: object
                    properties:
                      supported:
                        type: boolean
                        example: false
                        default: true
                  sort:
                    type: object
                    properties:
                      supported:
                        type: boolean
                        example: false
                        default: true
                  etag:
                    type: object
                    properties:
                      supported:
                        type: boolean
                        example: false
                        default: true
                  authenticationSchemes:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: oauthbearertoken
                        name:
                          type: string
                          example: OAuth 2
                        description:
                          type: string
                          example: Oauth 2 implemented with bearer token
                  Schemas:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: User
                        name:
                          type: string
                          example: User
                        description:
                          type: string
                          example: User Account
