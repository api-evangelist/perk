info:
  title: scim-server Service Provider Config API
  version: '1.5'
  description: Use this API to provision and manage users in Perk via System for Cross-domain Identity Management (SCIM 2.0).
servers:
- url: https://app.perk.com/api/v2/scim
security:
- sec0: []
tags:
- name: Service Provider Config
paths:
  /ServiceProviderConfig:
    get:
      summary: Get service provider configuration
      description: Returns Perk's configuration details for the System for Cross-domain Identity Management (SCIM) API, including which operations are supported.
      operationId: service-provider-configuration
      responses:
        '200':
          description: Returns `200 OK` and the service provider configuration.
          content:
            application/json:
              examples:
                Result:
                  value:
                    schemas:
                    - urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
                    patch:
                      supported: true
                    bulk:
                      supported: false
                      maxOperations: 0
                      maxPayloadSize: 0
                    filter:
                      supported: true
                      maxResults: 50
                    changePassword:
                      supported: false
                    sort:
                      supported: false
                    etag:
                      supported: false
                    authenticationSchemes:
                    - type: oauthbearertoken
                      name: OAuth 2
                      description: Oauth 2 implemented with bearer token
                    Schemas:
                    - id: User
                      name: User
                      description: User Account
                    meta:
                      location: https://app.perk.com/api/v2/scim/ServiceProviderConfig
                      resourceType: ServiceProviderConfig
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      example: urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
                  patch:
                    type: object
                    properties:
                      supported:
                        type: boolean
                        example: true
                        default: true
                  bulk:
                    type: object
                    properties:
                      supported:
                        type: boolean
                        example: false
                        default: true
                      maxOperations:
                        type: integer
                        example: 0
                        default: 0
                      maxPayloadSize:
                        type: integer
                        example: 0
                        default: 0
                  filter:
                    type: object
                    properties:
