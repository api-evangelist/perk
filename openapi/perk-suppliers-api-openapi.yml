- name: Suppliers
paths:
  /suppliers:
    get:
      summary: List all suppliers
      description: Suppliers listed in ascending order by id
      operationId: list-all-suppliers
      parameters:
      - name: booking_id
        in: query
        description: Find Suppliers related to the given booking_id's
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: offset
        in: query
        description: Pagination offset index, 0 based
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Pagination maximum number of elements to return. See more info in [Pagination](pagination-1)
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"suppliers\": [\n    {\n      \"id\": \"1\",\n      \"name\": \"Supplier A\",\n      \"bookings\": [\n        \"123\", \"456\"\n      ]\n    },\n    {\n      \"id\": \"2\",\n      \"name\": \"Supplier B\",\n      \"bookings\": [\n        \"789\", \"101\"\n      ]\n    }\n  ],\n  \"limit\": 10,\n  \"offset\": 0,\n  \"total\": 2\n}"
              schema:
                type: object
                properties:
                  suppliers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '1'
                        name:
                          type: string
                          example: Supplier A
                        bookings:
                          type: array
                          items:
                            type: string
                            example: '123'
                  limit:
                    type: integer
                    example: 10
                    default: 0
                  offset:
                    type: integer
                    example: 0
                    default: 0
                  total:
                    type: integer
                    example: 2
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"error\":{\n    \"type\":\"bad_request\",\n    \"errors\":[\n      {\n        \"reason\":\"booking_id needs to be a single id or a comma (',') separated list of ids\"\n      }\n    ]\n  }\n}"
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: bad_request
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            reason:
                              type: string
                              example: booking_id needs to be a single id or a comma (',') separated list of ids
      deprecated: false
      x-readme:
