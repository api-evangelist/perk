        samples-languages:
        - curl
      tags:
      - Webhooks
  /webhooks/{id}:
    patch:
      summary: Update a webhook endpoint
      description: Updates the webhook endpoint. You may edit the url, the list of events, status, secret or name. The target url of the webhook must be unique for the account, if the target url is not unique a client error HTTP 409 will be returned.
      operationId: update-subscription
      parameters:
      - name: id
        in: path
        description: Unique identifier for the webhook.
        schema:
          type: integer
          format: int32
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"b42820bb-24c9-48da-bded-487681e9c851\",\n    \"name\": \"invoice webhook\",\n    \"url\": \"https://mycompany.com/tk_webhook\",\n    \"secret\": \"some secret\",\n    \"status\": \"enabled\",\n    \"events\": [\n        \"invoice.issued\",\n        \"invoiceline.created\"\n    ]\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: b42820bb-24c9-48da-bded-487681e9c851
                  name:
                    type: string
                    example: invoice webhook
                  url:
                    type: string
                    example: https://mycompany.com/tk_webhook
                  secret:
                    type: string
                    example: some secret
                  status:
                    type: string
                    example: enabled
                  events:
                    type: array
                    items:
                      type: string
                      example: invoice.issued
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"url\": [\n        \"Enter a valid URL.\"\n    ]\n}"
              schema:
                type: object
                properties:
                  url:
                    type: array
                    items:
                      type: string
                      example: Enter a valid URL.
        '409':
          description: '409'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl -d '{\"enabled\":\"false\"}' \\\n  -H 'Authorization: ApiKey 123456.abcdefghijklmnopqrstuvwxyz123456' \\\n  -H 'Api-Version: 1' \\\n  -H 'Content-Type: application/json' \\\n  -X PATCH https://api.travelperk.com/webhooks/b42820bb-24c9-48da-bded-487681e9c851"
        samples-languages:
        - curl
      tags:
      - Webhooks
    get:
      summary: Retrieve a webhook endpoint
      description: Get details for a specific webhook endpoint
      operationId: get-subscription-details
      parameters:
