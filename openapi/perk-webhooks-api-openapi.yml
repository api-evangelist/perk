info:
  title: travelperk-api-v1 Webhooks API
  version: '1.5'
servers:
- url: https://api.travelperk.com/
security:
- sec0: []
tags:
- name: Webhooks
paths:
  /webhooks:
    post:
      summary: Create a webhook endpoint
      description: Subscribes to one or more events, the target url of the webhook must be unique for the account.
      operationId: subscribe-to-event
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: A name that identifies this subscription. This name will be sent on the notification JSON payload.
                url:
                  type: string
                  description: Target URL where notification JSON payloads will be POSTed.
                secret:
                  type: string
                  description: A secret only know by the user and TravelPerk. This secret will be used to sign the payload and send it in the `Tk-Signature` header.
                events:
                  type: array
                  description: A list of event names to which the user is subscribing to.
                  items:
                    type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"b42820bb-24c9-48da-bded-487681e9c851\",\n    \"name\": \"invoice webhook\",\n    \"url\": \"https://mycompany.com/tkwebhooks\",\n    \"secret\": \"some secret\",\n    \"status\": \"enabled\",\n    \"events\": [\n        \"invoice.issued\"\n    ],\n    \"successfully_sent\": 0,\n    \"failed_sent\": 0,\n    \"error_rate\": 0.0\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: b42820bb-24c9-48da-bded-487681e9c851
                  name:
                    type: string
                    example: invoice webhook
                  url:
                    type: string
                    example: https://mycompany.com/tkwebhooks
                  secret:
                    type: string
                    example: some secret
                  status:
                    type: string
                    example: enabled
                  events:
                    type: array
                    items:
                      type: string
                      example: invoice.issued
                  successfully_sent:
                    type: integer
                    example: 0
                    default: 0
                  failed_sent:
                    type: integer
                    example: 0
                    default: 0
                  error_rate:
                    type: integer
                    example: 0
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"url\": [\n        \"Enter a valid URL.\"\n    ]\n}"
              schema:
                type: object
                properties:
                  url:
                    type: array
                    items:
                      type: string
                      example: Enter a valid URL.
        '409':
          description: '409'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"error\": \"This subscription already exists. Use patch to amend it\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: This subscription already exists. Use patch to amend it
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl -d '{\"name\": \"invoice webhook\", \"url\": \"https://mycompany.com/tkwebhooks\", \"secret\":\"some secret\",\"events\": [\"invoice.issued\"]}' \\\n  -H 'Authorization: ApiKey 123456.abcdefghijklmnopqrstuvwxyz123456' \\\n  -H 'Content-Type: application/json' \\\n  -H 'Api-Version: 1' \\\n  -X POST https://api.sandbox-travelperk.com/webhooks\n\n\n"
        samples-languages:
        - curl
      tags:
      - Webhooks
    get:
      summary: List all webhook endpoints
      description: List all webhook subscriptions
      operationId: list-webhooks
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"webhooks\": [\n        {\n            \"id\": \"b42820bb-24c9-48da-bded-487681e9c851\",\n            \"name\": \"invoice webhook\",\n            \"url\": \"https://mycompany/tkwebhook\",\n            \"secret\": \"some secret\",\n            \"status\": \"enabled\",\n            \"events\": [\n                \"invoice.issued\",\n                \"invoiceline.created\"\n            ],\n            \"successfully_sent\": 2,\n            \"failed_sent\": 0,\n            \"error_rate\": 0.0\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: b42820bb-24c9-48da-bded-487681e9c851
                        name:
                          type: string
                          example: invoice webhook
                        url:
                          type: string
                          example: https://mycompany/tkwebhook
                        secret:
                          type: string
                          example: some secret
                        status:
                          type: string
                          example: enabled
                        events:
                          type: array
                          items:
                            type: string
                            example: invoice.issued
                        successfully_sent:
                          type: integer
                          example: 2
                          default: 0
                        failed_sent:
                          type: integer
                          example: 0
                          default: 0
                        error_rate:
                          type: integer
                          example: 0
                          default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl -i \\\n  -H 'Authorization: ApiKey 123456.abcdefghijklmnopqrstuvwxyz123456' \\\n  -H 'Api-Version: 1' \\\n  -X GET https://api.travelperk.com/webhooks"
        samples-languages:
        - curl
      tags:
      - Webhooks
  /webhooks/events:
    get:
      summary: List all events
      description: List all events you can subscribe to
      operationId: list-events
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n    {\n        \"name\": \"invoice.issued\",\n        \"topic\": \"invoices\"\n    },\n    {\n        \"name\": \"invoiceline.created\",\n        \"topic\": \"invoices\"\n    }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: invoice.issued
                    topic:
                      type: string
                      example: invoices
      deprecated: false
