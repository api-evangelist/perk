                        meta:
                          type: object
                          properties:
                            resourceType:
                              type: string
                              example: Schema
                            location:
                              type: string
                              example: https://app.perk.com/api/v2/scim/Schemas/urn:ietf:params:scim:schemas:core:2.0:User
                        schemaExtensions:
                          type: array
