          code: " curl \\\n  --url https://app.perk.com/api/v2/scim/Schemas \\\n  --header 'Authorization: apikey <your_api_key>' "
        samples-languages:
        - curl
  /Schemas/urn:ietf:params:scim:schemas:core:2.0:User:
    get:
      summary: Get the user schema
      description: Lists all attributes of the user schema.
      operationId: get-user-schema
      responses:
        '200':
          description: Returns `200 OK` and the user schema definition.
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: urn:ietf:params:scim:schemas:core:2.0:User
                    name: User
                    description: User Account Schema
                    attributes:
                    - name: name
                      type: complex
                      multiValued: false
                      description: The components of the user's real name. Providers MAY return just the full name as a single string in the formatted sub-attribute, or they MAY return just the individual component attributes using the other sub-attributes, or they MAY return both. If both variants are returned, they SHOULD be describing the same name, with the formatted name indicating how the component attributes should be combined.
                      required: true
                      subAttributes:
                      - name: familyName
                        type: string
                        multiValued: false
                        description: The family name of the User, or last name in most Western languages (e.g., 'Jensen' given the full name 'Ms. Barbara J Jensen, III').
                        required: true
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: givenName
                        type: string
                        multiValued: false
                        description: The given name of the User, or first name in most Western languages (e.g., 'Barbara' given the full name 'Ms. Barbara J Jensen, III').
                        required: true
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: middleName
                        type: string
                        multiValued: false
                        description: The middle name(s) of the User (e.g., 'Jane' given the full name 'Ms. Barbara J Jensen, III').
                        required: false
                        caseExact: false
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      - name: honorificPrefix
                        type: string
                        multiValued: false
                        description: The honorific prefix(es) of the User, or title in most Western languages (e.g., 'Ms.' given the full name 'Ms. Barbara J Jensen, III').
                        required: false
                        caseExact: true
                        mutability: readWrite
                        returned: default
                        uniqueness: none
                      mutability: readWrite
                      returned: default
                      uniqueness: none
                    - name: externalId
                      type: string
                      multiValued: false
                      description: Unique identifier of the user in the client system.
                      required: false
                      mutability: readWrite
                      returned: default
                      uniqueness: server
                    - name: title
