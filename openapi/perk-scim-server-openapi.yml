                        description:
                          type: string
                          example: User Account Schema
                        attributes:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: name
                              type:
                                type: string
                                example: complex
                              multiValued:
                                type: boolean
                                example: false
                                default: true
                              description:
                                type: string
                                example: The components of the user's real name. Providers MAY return just the full name as a single string in the formatted sub-attribute, or they MAY return just the individual component attributes using the other sub-attributes, or they MAY return both. If both variants are returned, they SHOULD be describing the same name, with the formatted name indicating how the component attributes should be combined.
                              required:
                                type: boolean
                                example: true
                                default: true
                              subAttributes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      example: familyName
                                    type:
                                      type: string
                                      example: string
                                    multiValued:
                                      type: boolean
                                      example: false
                                      default: true
                                    description:
                                      type: string
                                      example: The family name of the User, or last name in most Western languages (e.g., 'Jensen' given the full name 'Ms. Barbara J Jensen, III').
                                    required:
                                      type: boolean
                                      example: true
                                      default: true
                                    caseExact:
                                      type: boolean
                                      example: false
                                      default: true
                                    mutability:
                                      type: string
