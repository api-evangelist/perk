openapi: 3.2.0
info:
  title: travelperk-api-v1 Bookings API
  version: '1.5'
servers:
- url: https://api.travelperk.com/
security:
- sec0: []
tags:
- name: Bookings
paths:
  /bookings:
    get:
      summary: List all bookings
      description: Bookings listed in descending order of `modified` time.
      operationId: list-all-bookings
      parameters:
      - name: modified_gte
        in: query
        description: Find Bookings with modified greater than or equal to this time
        schema:
          type: string
          format: date
      - name: modified_lt
        in: query
        description: Find Bookings with modified less than this time
        schema:
          type: string
          format: date
      - name: status
        in: query
        description: Filter for Bookings with this status
        schema:
          type: string
      - name: type
        in: query
        description: Filter for Bookings of this type
        schema:
          type: string
      - name: trip_id
        in: query
        description: Filter for Bookings in the Trip with this id. A comma separated list of multiple ids is accepted.
        schema:
          type: string
      - name: offset
        in: query
        description: Pagination offet index, 0 based
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Pagination maximum number of elements to return. See more info in [Pagination](reference#pagination-1)
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: '200'
          content:
            application/json:
