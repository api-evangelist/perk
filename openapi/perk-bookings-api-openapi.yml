egments\":[\n            {\n              \"origin\":{\n                \"location\":{\n                  \"latitude\":\"-73.000000000\",\n                  \"longitude\":\"-26.000000000\",\n                  \"iata_code\":null,\n                  \"name\": \"name\",\n        \t\t\t\t\t\"address\": \"address\"\n                },\n                \"time\":\"2021-03-06T00:00:00+00:00\"\n              },\n              \"destination\":{\n                \"location\":{\n                  \"latitude\":\"-30.000000000\",\n                  \"longitude\":\"83.000000000\",\n                  \"iata_code\":null,\n                  \"name\": \"name\",\n        \t\t\t\t\t\"address\": \"address\"\n                },\n                \"time\":\"2021-03-09T00:00:00+00:00\"\n              },\n              \"external_id\":\"XX1234\"\n            }\n          ]\n        }\n      ]\n    }\n  ],\n  \"limit\":10,\n  \"offset\":0,\n  \"total\":4\n}"
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '71'
                        start:
                          type: string
                          example: '2021-03-06T00:00:00+00:00'
                        end:
                          type: string
                          example: '2021-03-07T00:00:00+00:00'
                        type:
                          type: string
                          example: hotel
                        status:
                          type: string
                          example: ticketed
                        modified:
                          type: string
                          example: '2021-01-04T11:11:20.714987+00:00'
                        trip_id:
                          type: string
                          example: '51'
                        references:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                example: confirmation_number
                              value:
                                type: string
                                example: '4636'
                        location:
                          type: object
                          properties:
                            latitude:
                              type: string
                              example: '59.5468062'
                            longitude:
                              type: string
                              example: '113.9913155'
                            iata_code: {}
                            name:
                              type: string
                              example: name
                            address:
                              type: string
                              example: address
                        drop_off_location: {}
                        legs: {}
                  limit:
                    type: integer
                    example: 10
                    default: 0
                  offset:
                    type: integer
                    example: 0
                    default: 0
                  total:
                    type: integer
                    example: 4
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"error\":{\n    \"type\":\"bad_request\",\n    \"errors\":[\n      {\n        \"reason\":\"The type filter must be one of: flight, hotel, train, car, other\"\n      }\n    ]\n  }\n}"
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: bad_request
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            reason:
