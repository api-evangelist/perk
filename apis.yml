aid: perk

name: Perk

description: Perk (formerly TravelPerk) is the intelligent platform for corporate travel and spend management, combining travel booking with expense,
  invoice, and card controls for finance teams. Founded in Barcelona in 2015, Perk serves thousands of global teams and is backed by General Catalyst,
  SoftBank Vision Fund, Speedinvest and others. Its developer platform exposes a Travel & Spend REST API, a SCIM 2.0 user-provisioning API, webhooks,
  a sandbox, a public Postman collection, and an official hosted Model Context Protocol (MCP) server for AI clients.

